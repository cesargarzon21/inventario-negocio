
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Mi Inventario</title>
    <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <section id="pantallaLogin" class="pantalla-login">
        <div class="login-contenedor">
            <div class="login-logo">📦</div>

            <h1>Mi Inventario</h1>
            <p>Accede a tu espacio de trabajo</p>

            <form id="formLogin">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

                <p id="mensajeLogin"></p>
            </form>
        </div>
    </section>

    <!-- APLICACIÓN DE INVENTARIO -->
    <div id="aplicacion" hidden>

        <header class="encabezado">
            <h1>Inventario</h1>
            <div class="usuario">👤</div>
        </header>

        <main class="contenedor">

            <section class="busqueda">
                <span class="icono">⌕</span>

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar producto"
                >

                <button id="btnEscanear" aria-label="Escanear código de barras">
                    <svg
                        class="icono-escaner"
                        viewBox="0 0 48 48"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M16 5H9a4 4 0 0 0-4 4v7"/>
                        <path d="M32 5h7a4 4 0 0 1 4 4v7"/>
                        <path d="M5 32v7a4 4 0 0 0 4 4h7"/>
                        <path d="M43 32v7a4 4 0 0 1-4 4h-7"/>
                        <path d="M15 18v12"/>
                        <path d="M20 18v12"/>
                        <path d="M25 18v12"/>
                        <path d="M29 18v12"/>
                        <path d="M34 18v12"/>
                        <path d="M12 24h24"/>
                    </svg>
                </button>
            </section>

            <section class="productos">
                <h2>Productos</h2>

                <button class="tarjeta-producto" id="btnInventario">
                    <span class="icono-producto">🛒</span>
                    <span>Producto</span>
                    <strong id="totalProductos">0</strong>
                </button>
            </section>

            <section class="agregar">
                <h2>Añadir producto</h2>

                <button class="tarjeta-agregar" id="btnRegistrar">
                    <span class="icono-agregar">📷</span>
                    <span>Añadir producto</span>
                </button>
            </section>

        </main>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
