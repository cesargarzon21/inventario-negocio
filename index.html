<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Mi Inventario</title>

    <link rel="stylesheet" href="styles.css?v=7">
</head>

<body>

    <!-- PANTALLA DE INICIO DE SESIÓN -->

    <section id="pantallaLogin" class="pantalla-login">

        <div class="login-contenedor">

            <div class="login-logo">📦</div>

            <h1>Mi Inventario</h1>

            <p>Accede a tu espacio de trabajo</p>

            <form id="formLogin">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

                <p id="mensajeLogin"></p>

            </form>

        </div>

    </section>


    <!-- APLICACIÓN DE INVENTARIO -->

    <div id="aplicacion" hidden>

        <!-- ENCABEZADO -->

        <header class="encabezado">

            <h1>Inventario</h1>

            <!-- MENÚ DE USUARIO -->

            <div class="menu-usuario">

                <button
                    class="usuario"
                    id="btnMenuUsuario"
                    aria-label="Menú de usuario"
                    aria-expanded="false"
                    aria-controls="menuDesplegable"
                    type="button"
                >
                    
                </button>

                <div
                    class="desplegable-usuario"
                    id="menuDesplegable"
                    hidden
                >

                    <div class="datos-usuario">

                        <strong>Mi cuenta</strong>

                        <span id="correoUsuario"></span>

                    </div>

                    <button
                        id="btnAdministrarUsuarios"
                        type="button"
                        hidden
                    >
                        👥 Administrar usuarios
                    </button>

                    <button
                        id="btnCerrarSesion"
                        type="button"
                    >
                        ↪ Cerrar sesión
                    </button>

                </div>

            </div>

        </header>


        <!-- CONTENIDO PRINCIPAL -->

        <main class="contenedor">

            <!-- BUSCADOR Y ESCÁNER -->

            <section class="busqueda">

                <span class="icono">⌕</span>

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar producto"
                >

                <button
                    id="btnEscanear"
                    aria-label="Escanear código de barras"
                    type="button"
                >

                    <svg
                        class="icono-escaner"
                        viewBox="0 0 48 48"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path d="M16 5H9a4 4 0 0 0-4 4v7"/>

                        <path d="M32 5h7a4 4 0 0 1 4 4v7"/>

                        <path d="M5 32v7a4 4 0 0 0 4 4h7"/>

                        <path d="M43 32v7a4 4 0 0 1-4 4h-7"/>

                        <path d="M15 18v12"/>

                        <path d="M20 18v12"/>

                        <path d="M25 18v12"/>

                        <path d="M29 18v12"/>

                        <path d="M34 18v12"/>

                        <path d="M12 24h24"/>

                    </svg>

                </button>

            </section>


            <!-- PRODUCTOS -->

            <section class="productos">

                <h2>Productos</h2>

                <button
                    class="tarjeta-producto"
                    id="btnInventario"
                    type="button"
                >

                    <span class="icono-producto">🛒</span>

                    <span>Producto</span>

                    <strong id="totalProductos">0</strong>

                </button>

            </section>


            <!-- AÑADIR PRODUCTO -->

            <section class="agregar">

                <h2>Añadir producto</h2>

                <button
                    class="tarjeta-agregar"
                    id="btnRegistrar"
                    type="button"
                >

                    <span class="icono-agregar">📷</span>

                    <span>Añadir producto</span>

                </button>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script type="module" src="app.js?v=3"></script>

</body>

</html>
