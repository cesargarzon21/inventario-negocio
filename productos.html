
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075b46">

    <title>Productos | Inventario</title>

    <link rel="stylesheet" href="productos.css?v=3">
</head>

<body>

    <header class="encabezado">

        <button
            id="btnVolver"
            type="button"
            aria-label="Volver"
        >
            ←
        </button>

        <h1>Productos</h1>

    </header>


    <main class="contenedor">

        <!-- RESUMEN DEL INVENTARIO -->

        <section class="tarjeta">

            <div class="titulo-seccion">

                <h2>Inventario general</h2>

                <p>Consulta los productos registrados en tu negocio.</p>

            </div>

            <div class="resumen-productos">

                <div>

                    <span>Total de productos</span>

                    <strong id="totalProductos">0</strong>

                </div>

                <span class="icono-resumen">📦</span>

            </div>

        </section>


        <!-- LISTA DE PRODUCTOS -->

        <section class="tarjeta">

            <h2>Productos registrados</h2>

            <!-- BUSCADOR CON ESCÁNER -->

            <div class="busqueda-productos">

                <span>⌕</span>

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar por nombre o código"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="btnEscanearBusqueda"
                    class="btn-escanear"
                    aria-label="Escanear para buscar producto"
                    title="Escanear código de barras"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M4 7V5a1 1 0 0 1 1-1h2"></path>
                        <path d="M17 4h2a1 1 0 0 1 1 1v2"></path>
                        <path d="M20 17v2a1 1 0 0 1-1 1h-2"></path>
                        <path d="M7 20H5a1 1 0 0 1-1-1v-2"></path>
                        <path d="M4 12h16"></path>
                        <path d="M8 9v6"></path>
                        <path d="M12 9v6"></path>
                        <path d="M16 9v6"></path>
                    </svg>

                </button>

            </div>


            <!-- PANEL DEL ESCÁNER DE BÚSQUEDA -->

            <div id="panelEscanerBusqueda" hidden>

                <div id="lectorCamaraBusqueda"></div>

                <p id="mensajeEscanerBusqueda">
                    Apunta la cámara al código de barras del producto.
                </p>

                <button
                    type="button"
                    id="btnCerrarEscanerBusqueda"
                >
                    Cancelar escaneo
                </button>

            </div>


            <p id="mensajeProductos">Cargando productos...</p>

            <div id="listaProductos"></div>

        </section>

    </main>


    <!-- VENTANA EMERGENTE DEL PRODUCTO -->

    <div
        id="modalProducto"
        class="modal-producto"
        hidden
    >

        <div class="contenido-modal">

            <!-- ENCABEZADO Y ACCIONES -->

            <div class="encabezado-modal">

                <h2 id="tituloModal">Editar producto</h2>

                <div class="acciones-modal">

                    <!-- ELIMINAR -->

                    <button
                        type="button"
                        id="btnEliminarProducto"
                        class="btn-icono btn-eliminar"
                        aria-label="Eliminar producto"
                        title="Eliminar producto"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            width="22"
                            height="22"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M19 6l-1 14H6L5 6"></path>
                            <path d="M10 11v5"></path>
                            <path d="M14 11v5"></path>
                        </svg>

                    </button>


                    <!-- DUPLICAR -->

                    <button
                        type="button"
                        id="btnDuplicarProducto"
                        class="btn-icono btn-duplicar"
                        aria-label="Duplicar producto"
                        title="Duplicar producto"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            width="22"
                            height="22"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="8"
                                y="8"
                                width="13"
                                height="13"
                                rx="2"
                            ></rect>

                            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                        </svg>

                    </button>


                    <!-- CERRAR -->

                    <button
                        type="button"
                        id="btnCerrarModal"
                        class="btn-icono btn-cerrar"
                        aria-label="Cerrar ventana"
                    >
                        ✕
                    </button>

                </div>

            </div>


            <!-- FORMULARIO DE EDICIÓN -->

            <form id="formEditarProducto">

                <div class="campos-modal">


                    <!-- NOMBRE -->

                    <div class="campo-modal">

                        <label for="editarNombre">
                            Nombre del producto
                        </label>

                        <input
                            type="text"
                            id="editarNombre"
                            required
                        >

                    </div>


                    <!-- CÓDIGO DE BARRAS Y ESCÁNER -->

                    <div class="campo-modal">

                        <label for="editarCodigo">
                            Código de barras
                        </label>

                        <div class="campo-codigo">

                            <input
                                type="text"
                                id="editarCodigo"
                                required
                                autocomplete="off"
                            >

                            <button
                                type="button"
                                id="btnEscanearCodigo"
                                class="btn-escanear"
                                aria-label="Escanear código de barras"
                                title="Escanear código de barras"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    width="24"
                                    height="24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M4 7V5a1 1 0 0 1 1-1h2"></path>
                                    <path d="M17 4h2a1 1 0 0 1 1 1v2"></path>
                                    <path d="M20 17v2a1 1 0 0 1-1 1h-2"></path>
                                    <path d="M7 20H5a1 1 0 0 1-1-1v-2"></path>
                                    <path d="M4 12h16"></path>
                                    <path d="M8 9v6"></path>
                                    <path d="M12 9v6"></path>
                                    <path d="M16 9v6"></path>
                                </svg>

                            </button>

                        </div>


                        <!-- PANEL DE LA CÁMARA DE EDICIÓN -->

                        <div id="panelEscaner" hidden>

                            <div id="lectorCamara"></div>

                            <p id="mensajeEscaner">
                                Apunta la cámara al código de barras.
                            </p>

                            <button
                                type="button"
                                id="btnCerrarEscaner"
                            >
                                Cancelar escaneo
                            </button>

                        </div>

                    </div>


                    <!-- PRECIO DE COMPRA -->

                    <div class="campo-modal">

                        <label for="editarPrecioCompra">
                            Precio de compra
                        </label>

                        <input
                            type="number"
                            id="editarPrecioCompra"
                            min="0"
                            step="1"
                            required
                        >

                    </div>


                    <!-- PRECIO DE VENTA -->

                    <div class="campo-modal">

                        <label for="editarPrecioVenta">
                            Precio de venta
                        </label>

                        <input
                            type="number"
                            id="editarPrecioVenta"
                            min="0"
                            step="1"
                            required
                        >

                    </div>


                    <!-- CANTIDAD -->

                    <div class="campo-modal">

                        <label for="editarCantidad">
                            Cantidad en inventario
                        </label>

                        <input
                            type="number"
                            id="editarCantidad"
                            min="0"
                            step="1"
                            required
                        >

                    </div>

                </div>


                <p id="mensajeModal"></p>


                <!-- GUARDAR CAMBIOS -->

                <button
                    type="submit"
                    id="btnGuardarCambios"
                    class="btn-guardar-cambios"
                >
                    Guardar cambios
                </button>

            </form>

        </div>

    </div>


    <!-- BIBLIOTECA DEL ESCÁNER -->

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


    <!-- JAVASCRIPT DE PRODUCTOS -->

    <script
        type="module"
        src="productos.js?v=5"
    ></script>

</body>

</html>
