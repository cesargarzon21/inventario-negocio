
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075b46">

    <title>Administrar usuarios | Inventario</title>

    <link rel="stylesheet" href="usuarios.css?v=1">
</head>

<body>

    <header class="encabezado">
        <button id="btnVolver" type="button" aria-label="Volver">
            ←
        </button>

        <h1>Administrar usuarios</h1>
    </header>

    <main class="contenedor">

        <section class="tarjeta">
            <div class="titulo-seccion">
                <h2>Crear empleado</h2>
                <p>Registra una nueva cuenta para tu negocio.</p>
            </div>

            <form id="formCrearUsuario">

                <label for="nombreEmpleado">Nombre del empleado</label>
                <input
                    type="text"
                    id="nombreEmpleado"
                    placeholder="Nombre completo"
                    required
                >

                <label for="correoEmpleado">Correo electrónico</label>
                <input
                    type="email"
                    id="correoEmpleado"
                    placeholder="empleado@correo.com"
                    required
                >

                <label for="contrasenaEmpleado">Contraseña asignada</label>
                <input
                    type="password"
                    id="contrasenaEmpleado"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >

                <button type="submit" id="btnCrearUsuario">
                    Crear empleado
                </button>

                <p id="mensajeUsuario"></p>

            </form>
        </section>

        <section class="tarjeta">
            <h2>Empleados registrados</h2>

            <div id="listaUsuarios">
                <p>Cargando empleados...</p>
            </div>
        </section>

    </main>

    <script type="module" src="usuarios.js?v=1"></script>

</body>
</html>
